[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timedo-forecasting"
version = "0.1.0"
description = "Deep Orthogonality models for multivariate time-series forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.0",
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["timedo*"]
